<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronóstico de Series Temporales SARIMA</title>
  <!-- Chart.js para renderizar la gráfica de serie de tiempo -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #38bdf8;
      --accent-forecast: #f59e0b;
      --error-bg: #7f1d1d;
      --error-text: #fca5a5;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-primary); padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { margin-bottom: 24px; text-align: center; }
    header h1 { font-size: 1.8rem; color: var(--accent-color); margin-bottom: 6px; }
    header p { color: var(--text-secondary); font-size: 0.95rem; }

    /* Panel de controles */
    .controls-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
    .form-group input, .form-group select {
      background-color: #090d16;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }
    button:hover { opacity: 0.9; }

    /* Mensaje de Error */
    #error-container {
      display: none;
      background-color: var(--error-bg);
      color: var(--error-text);
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
      border: 1px solid #ef4444;
    }

    /* Tarjetas KPI destacadas */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .kpi-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px; }
    .kpi-value { font-size: 1.6rem; font-weight: bold; color: var(--text-primary); }
    .kpi-subtext { font-size: 0.75rem; color: var(--text-secondary); }

    /* Contenedor de la gráfica */
    .chart-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      height: 480px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Pronóstico de Series de Tiempo (SARIMA)</h1>
      <p>Visualizador en producción con datos de sensores en InfluxDB</p>
    </header>

    <!-- Controles de actualización -->
    <div class="controls-card">
      <div class="form-group">
        <label for="horas">Horas a Pronosticar:</label>
        <input type="number" id="horas" value="12" min="1" max="72">
      </div>
      <div class="form-group">
        <label for="historia">Horas de Historia:</label>
        <input type="number" id="historia" value="48" min="12" max="336">
      </div>
      <div class="form-group">
        <label for="confianza">Nivel de Confianza:</label>
        <select id="confianza">
          <option value="0.95" selected>95% (0.95)</option>
          <option value="0.90">90% (0.90)</option>
          <option value="0.80">80% (0.80)</option>
        </select>
      </div>
      <button onclick="cargarPronostico()">Actualizar Pronóstico</button>
    </div>

    <!-- Contenedor para mensajes de error de la API -->
    <div id="error-container"></div>

    <!-- Indicadores destacados (KPIs) -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <span class="kpi-title">Próxima Hora</span>
        <span class="kpi-value" id="kpi-prox-valor">--</span>
        <span class="kpi-subtext" id="kpi-prox-hora">--</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">Máximo Esperado</span>
        <span class="kpi-value" id="kpi-max-valor">--</span>
        <span class="kpi-subtext">En el período pronosticado</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">Última Observación</span>
        <span class="kpi-value" id="kpi-ult-valor">--</span>
        <span class="kpi-subtext" id="kpi-ult-hora">--</span>
      </div>
    </div>

    <!-- Gráfica principal -->
    <div class="chart-card">
      <canvas id="forecastChart"></canvas>
    </div>
  </div>

  <script>
    let chartInstance = null;

    // Conversión de UTC a Hora de Colombia (UTC-5)
    function formatHoraColombia(isoString) {
      if (!isoString) return '--';
      const date = new Date(isoString);
      return date.toLocaleString('es-CO', {
        timeZone: 'America/Bogota',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
    }

    async function cargarPronostico() {
      const errorDiv = document.getElementById('error-container');
      errorDiv.style.display = 'none';

      const horas = document.getElementById('horas').value;
      const historia = document.getElementById('historia').value;
      const confianza = document.getElementById('confianza').value;

      try {
        const response = await fetch(`/api/prediccion?horas=${horas}&historia=${historia}&confianza=${confianza}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Ocurrió un error al obtener la predicción');
        }

        renderKPIs(data);
        renderChart(data);

      } catch (err) {
        errorDiv.textContent = `Error API: ${err.message}`;
        errorDiv.style.display = 'block';
      }
    }

    function renderKPIs(data) {
      // 1. Última observación registrada en histórico
      if (data.historico && data.historico.length > 0) {
        const ult = data.historico[data.historico.length - 1];
        const valUlt = ult.valor !== undefined ? ult.valor : ult.value;
        if (valUlt !== undefined && valUlt !== null) {
          document.getElementById('kpi-ult-valor').textContent = Number(valUlt).toFixed(2);
        }
        document.getElementById('kpi-ult-hora').textContent = `Hora (COL): ${formatHoraColombia(ult.tiempo || ult.ds)}`;
      }

      // 2. Próxima hora pronosticada y máximo esperado
      if (data.prediccion && data.prediccion.length > 0) {
        const prox = data.prediccion[0]; // Corrección: primer elemento de la lista
        const valProx = prox.prediccion !== undefined ? prox.prediccion : prox.yhat;
        if (valProx !== undefined && valProx !== null) {
          document.getElementById('kpi-prox-valor').textContent = Number(valProx).toFixed(2);
        }
        document.getElementById('kpi-prox-hora').textContent = `Hora (COL): ${formatHoraColombia(prox.tiempo || prox.ds)}`;

        const limitesSuperiores = data.prediccion.map(p => p.limite_superior !== undefined ? p.limite_superior : p.yhat_upper);
        const maxPred = Math.max(...limitesSuperiores);
        if (!isNaN(maxPred)) {
          document.getElementById('kpi-max-valor').textContent = maxPred.toFixed(2);
        }
      }
    }

    function renderChart(data) {
      const ctx = document.getElementById('forecastChart').getContext('2d');

      const historicoLabels = data.historico.map(h => formatHoraColombia(h.tiempo || h.ds));
      const prediccionLabels = data.prediccion.map(p => formatHoraColombia(p.tiempo || p.ds));
      const labels = [...historicoLabels, ...prediccionLabels];

      const historicoVals = data.historico.map(h => h.valor !== undefined ? h.valor : h.value);
      const ultValorHist = historicoVals[historicoVals.length - 1];

      // Conectar la gráfica entre histórico y pronóstico
      const prediccionVals = Array(historicoVals.length - 1).fill(null);
      prediccionVals.push(ultValorHist);
      data.prediccion.forEach(p => prediccionVals.push(p.prediccion !== undefined ? p.prediccion : p.yhat));

      const limSupVals = Array(historicoVals.length - 1).fill(null);
      limSupVals.push(ultValorHist);
      data.prediccion.forEach(p => limSupVals.push(p.limite_superior !== undefined ? p.limite_superior : p.yhat_upper));

      const limInfVals = Array(historicoVals.length - 1).fill(null);
      limInfVals.push(ultValorHist);
      data.prediccion.forEach(p => limInfVals.push(p.limite_inferior !== undefined ? p.limite_inferior : p.yhat_lower));

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Histórico Observado',
              data: [...historicoVals, ...Array(data.prediccion.length).fill(null)],
              borderColor: '#38bdf8',
              backgroundColor: '#38bdf8',
              borderWidth: 2,
              pointRadius: 1,
              tension: 0.1
            },
            {
              label: 'Pronóstico SARIMA',
              data: prediccionVals,
              borderColor: '#f59e0b',
              backgroundColor: '#f59e0b',
              borderWidth: 2,
              borderDash: [5, 5],
              pointRadius: 2,
              tension: 0.1
            },
            {
              label: 'Límite Superior',
              data: limSupVals,
              borderColor: 'transparent',
              backgroundColor: 'rgba(245, 158, 11, 0.15)',
              pointRadius: 0,
              fill: '+1'
            },
            {
              label: 'Límite Inferior',
              data: limInfVals,
              borderColor: 'transparent',
              backgroundColor: 'transparent',
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#f8fafc',
                filter: item => item.text !== 'Límite Inferior'
              }
            },
            tooltip: { mode: 'index', intersect: false }
          },
          scales: {
            x: { ticks: { color: '#94a3b8', maxTicksLimit: 12 }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    // Cargar pronóstico inicial al abrir la página
    window.onload = cargarPronostico;
  </script>
</body>
</html>
